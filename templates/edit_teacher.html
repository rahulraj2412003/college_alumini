{% extends "admin_dashboard.html" %}

{% block content %}
<div class="main-content">
    <div class="welcome-bar">
        <h1>Edit Faculty Member</h1>
    </div>

    <div class="table-container" style="max-width: 600px;">
        <form method="POST">
            {% csrf_token %}
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">First Name</label>
                <input type="text" name="first_name" value="{{ teacher.user.first_name }}" required 
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Last Name</label>
                <input type="text" name="last_name" value="{{ teacher.user.last_name }}" required 
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px;">Email</label>
                <input type="email" name="email" value="{{ teacher.user.email }}" required 
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px;">Department</label>
                <input type="text" name="department" value="{{ teacher.department }}" placeholder="e.g. Computer Science" required 
                       style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px;">
            </div>

            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn-add">Update Teacher</button>
                <a href="{% url 'manage_teachers' %}" style="padding: 10px 20px; text-decoration: none; color: #64748b;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
