{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Login | Parivarthana Business School</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --faculty-blue: #002147; /* Oxford Blue */
            --accent-gold: #c5b358;  /* Academic Gold */
            --bg-shade: #f1f2f6;
            --white: #ffffff;
            --error-red: #d63031;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg-shade);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .faculty-card {
            background: var(--white);
            width: 100%;
            max-width: 400px;
            border-radius: 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            overflow: hidden;
            border-top: 5px solid var(--accent-gold);
        }

        .card-header {
            background: var(--faculty-blue);
            padding: 30px;
            text-align: center;
            color: var(--white);
        }

        .card-header i {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--accent-gold);
        }

        .card-header h2 {
            margin: 0;
            font-size: 1.4rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        form {
            padding: 30px;
        }

        /* Error Message Styling */
        .error-msg {
            background: #ffeaa7;
            color: #d63031;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 0.85rem;
            text-align: center;
            border: 1px solid var(--error-red);
        }

        .input-box {
            margin-bottom: 20px;
        }

        .input-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
        }

        input {
            width: 100%;
            padding: 12px 12px 12px 40px;
            border: 1px solid #dcdde1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--faculty-blue);
            box-shadow: 0 0 0 3px rgba(0, 33, 71, 0.1);
        }

        button[type="submit"] {
            width: 100%;
            background: var(--faculty-blue);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }

        button[type="submit"]:hover {
            background: #003366;
            transform: translateY(-1px);
        }

        .card-footer {
            padding: 20px;
            text-align: center;
            font-size: 0.85rem;
            background: #f9f9f9;
            border-top: 1px solid #eee;
        }

        .card-footer a {
            color: var(--faculty-blue);
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="faculty-card">
        <div class="card-header">
            <i class="fas fa-user-tie"></i>
            <h2>Faculty Login</h2>
        </div>

        <form method="post">
            {% csrf_token %}

            {% if error %}
            <div class="error-msg">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
            {% endif %}
            
            <div class="input-box">
                <label>Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" placeholder="Enter Faculty Username" required>
                </div>
            </div>

            <div class="input-box">
                <label>Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit">Sign In to Dashboard</button>
        </form>

        <div class="card-footer">
            Forgot credentials? <a href="#">Contact IT Support</a><br><br>
            <a href="/">&larr; Back to Main Portal</a>
        </div>
    </div>

</body>
</html>
