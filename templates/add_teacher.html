{% extends "admin_dashboard.html" %}

{% block content %}
{% if messages %}
    {% for message in messages %}
        <div style="padding: 15px; margin-bottom: 20px; border-radius: 8px; 
                    background-color: {% if message.tags == 'error' %}#fee2e2; color: #b91c1c;{% else %}#dcfce7; color: #166534;{% endif %};
                    border: 1px solid {% if message.tags == 'error' %}#fecaca;{% else %}#bbf7d0;{% endif %};">
            {{ message }}
        </div>
    {% endfor %}
{% endif %}
<div class="header-section">
    <h1><i class="fas fa-user-plus"></i> Register Faculty</h1>
    <a href="{% url 'manage_teachers' %}" class="btn-primary" style="background: #64748b;">
        <i class="fas fa-arrow-left"></i> Back
    </a>
</div>

<div class="card" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        {% csrf_token %}
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom:20px;">
            <div>
                <label style="display:block; margin-bottom:8px; font-weight:600;">First Name</label>
                <input type="text" name="first_name" required style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border);">
            </div>
            <div>
                <label style="display:block; margin-bottom:8px; font-weight:600;">Last Name</label>
                <input type="text" name="last_name" required style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border);">
            </div>
        </div>

        <div style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Email Address</label>
            <input type="email" name="email" required style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border);">
        </div>

        <div style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Department</label>
            <select name="department" required 
                    style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border); background:#f8fafc;">
                <option value="">-- Select Department --</option>
                {% for key, label in departments %}
                    <option value="{{ key }}">{{ label }}</option>
                {% endfor %}
            </select>
            <small style="color: #64748b;">The short code ({{ key }}) will be saved in the database.</small>
        </div>

        <div style="margin-bottom:30px;">
            <label style="display:block; margin-bottom:8px; font-weight:600;">Initial Password</label>
            <input type="password" name="password" required style="width:100%; padding:12px; border-radius:8px; border:1px solid var(--border);">
        </div>

        <button type="submit" class="btn-primary" style="width:100%; padding: 15px; border: none;">
            <i class="fas fa-save"></i> Save Faculty Member
        </button>
    </form>
</div>
{% endblock %}
