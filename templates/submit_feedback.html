{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Feedback | Parivarthana Business School</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-blue: #002147;
            --accent-gold: #c5b358;
            --bg-shade: #f8fafc;
            --white: #ffffff;
            --text-muted: #64748b;
            --error: #e11d48;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-shade);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .feedback-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        .feedback-card h2 {
            color: var(--primary-blue);
            margin-bottom: 8px;
            font-size: 1.8rem;
        }

        .event-name {
            color: var(--accent-gold);
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Star Rating CSS */
        .rating-wrapper {
            display: flex;
            flex-direction: row-reverse;
            justify-content: center;
            margin-bottom: 10px;
        }

        .rating-wrapper input { display: none; }

        .rating-wrapper label {
            cursor: pointer;
            width: 45px;
            height: 45px;
            font-size: 40px;
            color: #cbd5e1;
            transition: transform 0.2s, color 0.2s;
        }

        .rating-wrapper label:before { content: '★'; }

        .rating-wrapper input:checked ~ label { color: var(--accent-gold); }

        .rating-wrapper label:hover,
        .rating-wrapper label:hover ~ label {
            color: #fbbf24;
            transform: scale(1.1);
        }

        /* Textarea and Counter */
        .input-group {
            text-align: left;
            margin-top: 20px;
            position: relative;
        }

        textarea {
            width: 100%;
            height: 140px;
            padding: 15px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            resize: none;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 4px rgba(0, 33, 71, 0.1);
        }

        .char-counter {
            text-align: right;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Submit Button */
        .btn-submit {
            background: var(--primary-blue);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .btn-submit:hover {
            background: #001a38;
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 33, 71, 0.3);
        }

        .btn-submit:disabled {
            background: #94a3b8;
            cursor: not-allowed;
            transform: none;
        }

        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: var(--primary-blue);
        }
    </style>
</head>
<body>

    <div class="feedback-card">
        <div style="background: rgba(0,33,71,0.05); width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px;">
            <i class="fas fa-award" style="font-size: 2rem; color: var(--primary-blue);"></i>
        </div>
        
        <h2>Event Feedback</h2>
        <div class="event-name">{{ event.title }}</div>

        <form id="feedbackForm" method="POST">
            {% csrf_token %}
            
            <p style="margin-bottom: 5px; color: #475569; font-weight: 600;">Overall Rating</p>
            <div class="rating-wrapper">
                <input type="radio" name="rating" id="star5" value="5" required><label for="star5" title="Excellent"></label>
                <input type="radio" name="rating" id="star4" value="4"><label for="star4" title="Very Good"></label>
                <input type="radio" name="rating" id="star3" value="3"><label for="star3" title="Good"></label>
                <input type="radio" name="rating" id="star2" value="2"><label for="star2" title="Fair"></label>
                <input type="radio" name="rating" id="star1" value="1"><label for="star1" title="Poor"></label>
            </div>

            <div class="input-group">
                <p style="margin-bottom: 8px; color: #475569; font-weight: 600;">Your Experience</p>
                <textarea name="comment" id="comment" maxlength="500" placeholder="Please share your thoughts on the session, organization, or any suggestions for improvement..." required></textarea>
                <div class="char-counter"><span id="current">0</span> / 500</div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                Submit Feedback
            </button>
        </form>

        <a href="{% url 'student_home' %}" class="back-link">
            <i class="fas fa-arrow-left"></i> Return to Campus Portal
        </a>
    </div>

    <script>
        // Character Counter Logic
        const textarea = document.getElementById('comment');
        const counter = document.getElementById('current');

        textarea.addEventListener('input', () => {
            counter.textContent = textarea.value.length;
        });

        // AJAX Submission with SweetAlert2
        document.getElementById('feedbackForm').onsubmit = function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const originalText = btn.innerHTML;
            
            // Set Loading State
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Submitting...';
            btn.disabled = true;

            const formData = new FormData(this);

            fetch(window.location.href, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(response => {
                if (response.ok) {
                    Swal.fire({
                        title: 'Success!',
                        text: 'Your feedback has been submitted successfully. Thank you for helping us improve!',
                        icon: 'success',
                        confirmButtonColor: '#002147',
                        iconColor: '#c5b358',
                        allowOutsideClick: false
                    }).then((result) => {
                        if (result.isConfirmed) {
                            window.location.href = "{% url 'student_home' %}";
                        }
                    });
                } else {
                    throw new Error('Network response was not ok.');
                }
            })
            .catch(error => {
                Swal.fire({
                    title: 'Error!',
                    text: 'Unable to submit feedback. Please check your connection and try again.',
                    icon: 'error',
                    confirmButtonColor: '#a51c30'
                });
                btn.innerHTML = originalText;
                btn.disabled = false;
            });
        };
    </script>
</body>
</html>
