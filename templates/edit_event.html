<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event | PBS Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-blue: #002147;
            --accent-gold: #c5b358;
            --bg-shade: #f8fafc;
            --white: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-shade);
            display: flex;
            justify-content: center;
            padding: 50px 20px;
            margin: 0;
        }

        .form-container {
            background: var(--white);
            width: 100%;
            max-width: 600px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h2 {
            color: var(--primary-blue);
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #334155;
        }

        .input-group input, 
        .input-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            box-sizing: border-box;
        }

        .input-group textarea {
            height: 120px;
            resize: vertical;
        }

        .current-img {
            margin: 10px 0;
            padding: 10px;
            background: #f1f5f9;
            border-radius: 8px;
            font-size: 0.85rem;
        }

        .current-img img {
            display: block;
            max-width: 150px;
            margin-top: 10px;
            border-radius: 4px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-save {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            flex: 2;
            transition: 0.3s;
        }

        .btn-cancel {
            background: #e2e8f0;
            color: #475569;
            text-decoration: none;
            padding: 14px 25px;
            border-radius: 8px;
            text-align: center;
            flex: 1;
            font-weight: 600;
        }

        .btn-save:hover { background: #003366; }
        .btn-cancel:hover { background: #cbd5e1; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2><i class="fas fa-edit"></i> Edit Event Details</h2>
        
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="input-group">
                <label>Event Title</label>
                <input type="text" name="title" value="{{ event.title }}" required>
            </div>

            <div class="input-group">
                <label>Event Description</label>
                <textarea name="description" required>{{ event.description }}</textarea>
            </div>

            <div class="input-group">
                <label>Event Date</label>
                <input type="date" name="date" value="{{ event.date|date:'Y-m-d' }}" required>
            </div>

            <div class="input-group">
                <label>Event Banner Image</label>
                {% if event.image %}
                <div class="current-img">
                    Currently: <a href="{{ event.image.url }}" target="_blank">{{ event.image.name }}</a>
                    <img src="{{ event.image.url }}" alt="current event image">
                </div>
                {% endif %}
                <input type="file" name="image" accept="image/*">
                <small style="color: #64748b;">Leave empty to keep the current image.</small>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn-save">Update Event</button>
                <a href="{% url 'admin_dashboard' %}" class="btn-cancel">Cancel</a>
            </div>
        </form>
    </div>

</body>
</html>
