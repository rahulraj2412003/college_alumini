{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration | {{ event.title }}</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --primary-navy: #002147;
            --accent-crimson: #a51c30;
            --bg-soft: #f4f7f6;
            --white: #ffffff;
            --gold: #c5b358;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-soft);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .reg-card {
            background: var(--white);
            width: 100%;
            max-width: 500px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border-top: 8px solid var(--primary-navy);
        }

        .reg-header {
            padding: 30px;
            text-align: center;
            background: linear-gradient(to bottom, #fff, #fefefe);
            border-bottom: 1px solid #eee;
        }

        .reg-header h2 {
            margin: 10px 0 0;
            color: var(--primary-navy);
            font-size: 1.6rem;
        }

        .reg-header span {
            display: block;
            color: var(--gold);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        form {
            padding: 30px;
        }

        .input-field {
            margin-bottom: 25px;
        }

        .input-field label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--primary-navy);
            font-size: 0.9rem;
        }

        .input-field label i {
            margin-right: 5px;
            color: var(--gold);
        }

        .input-field input, 
        .input-field select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e1e1e1;
            border-radius: 8px;
            font-size: 1rem;
            font-family: inherit;
            box-sizing: border-box;
            transition: all 0.3s ease;
            background-color: #fff;
            color: #333;
        }

        .input-field input:focus, 
        .input-field select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 4px 12px rgba(197, 179, 88, 0.15);
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-navy);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        button[type="submit"]:hover {
            background-color: var(--accent-crimson);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(165, 28, 48, 0.3);
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #888;
            text-decoration: none;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--primary-navy);
        }

        @media (max-width: 480px) {
            .reg-header h2 { font-size: 1.3rem; }
            form { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="reg-card">
        <div class="reg-header">
            <span>Student Portal</span>
            <h2>Register for {{ event.title }}</h2>
        </div>

        <form method="post" id="registrationForm">
            {% csrf_token %}
            
            <div class="input-field">
                <label><i class="fas fa-user"></i> Full Name</label>
                <input type="text" name="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-field">
                <label><i class="fas fa-university"></i> Select Department</label>
                <select name="department" required>
                    <option value="" disabled selected>-- Choose your Department --</option>
                    <option value="MBA">MBA (Master of Business Administration)</option>
                    <option value="MCA">MCA (Master of Computer Applications)</option>
                    <option value="BBA">BBA (Bachelor of Business Administration)</option>
                    <option value="BCA">BCA (Bachelor of Computer Applications)</option>
                    <option value="M.Com">M.Com (Master of Commerce)</option>
                    <option value="B.Com">B.Com (Bachelor of Commerce)</option>
                </select>
            </div>

            <button type="submit" id="submitBtn">
                Confirm Registration <i class="fas fa-check-circle"></i>
            </button>

            <a href="/" class="back-link">
                <i class="fas fa-arrow-left"></i> Cancel and Return Home
            </a>
        </form>
    </div>

    <script>
        // Trigger SweetAlert if Django sends a success/error message
        {% if messages %}
            {% for message in messages %}
                Swal.fire({
                    title: "{% if message.tags == 'success' %}Registered!{% else %}Notification{% endif %}",
                    text: "{{ message }}",
                    icon: "{{ message.tags }}",
                    confirmButtonColor: '#002147',
                    iconColor: '{% if message.tags == "success" %}#c5b358{% endif %}'
                });
            {% endfor %}
        {% endif %}

        // Optional: Add loading state to button on click
        const form = document.getElementById('registrationForm');
        const btn = document.getElementById('submitBtn');

        form.onsubmit = function() {
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';
        };
    </script>
</body>
</html>
